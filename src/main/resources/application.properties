# Spring Boot Application Properties
spring.application.name=SaranyaMart
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.saranyamart=DEBUG

# Static Resource Handling (Embedded Tomcat serves static UI automatically)
spring.web.resources.static-locations=classpath:/static/

# AI Chatbot Configuration (Section 11 & Section 17 Specification)
ai.chatbot.provider=mock
ai.chatbot.api-key=
ai.chatbot.model=gemini-1.5-flash
